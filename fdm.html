  rowTable(){return `<div class="report-table" tabindex="0" role="region" aria-label="Scrollable digital quality report"><table><thead><tr><th>CHARACTERISTIC</th><th>READING</th><th>SPECIFICATION</th><th>INSTRUMENT</th><th>STATUS</th></tr></thead><tbody>${this.demo.records.map(r=>`<tr><td>${e(r.feature)}</td><td>${r.value.toFixed(3)} ${r.unit}</td><td>${r.lower.toFixed(3)}–${r.upper.toFixed(3)}</td><td>${e(r.instrument)}</td><td><span class="status ${r.result==='within_specification'?'':'warn'}">${r.result==='within_specification'?'In specification':'Review required'}</span></td></tr>`).join('')}</tbody></table></div>`;}
  reportView(){const p=K.plan(this.selected);return `<div class="report-top"><div><span class="mono">QC INSPECTOR / DESKTOP · ${p.qc} ACCOUNT${p.qc===1?'':'S'} INCLUDED</span><h3>Digital quality report.</h3><p>DEMO-014 · Revision B · Example inspection record</p></div><button class="btn small-btn outline" data-action="export-report">Export sample CSV <span>↓</span></button></div>${this.rowTable()}<div class="notice"><strong>Digital reporting is included in ${p.name}.</strong> Measurements, limits and context are shown together for inspection review. ${p.id==='lite'?'The Feedback-Driven Engine is not included.':'Feedback-Driven Engine access remains to be confirmed.'}</div><div class="report-foot"><p>Illustrative report layout. CSV is a sample export, not a signed inspection certificate. Report approval, templates, retention and audit controls must be defined in the FDM backend.</p><button class="text-btn" data-role="machinist">Add a sample reading <span>→</span></button></div>`;}
  supervisor(){const d=this.demo.getStats();const metrics=`<div class="stats"><div class="stat"><span class="mono">MEASUREMENTS</span><strong>${d.records}</strong><small>Example records in this session</small></div><div class="stat"><span class="mono">REVIEW REQUIRED</span><strong>${d.exceptions}</strong><small>Outside configured limits</small></div><div class="stat"><span class="mono">QC ALLOCATION</span><strong>2</strong><small>Desktop inspector accounts</small></div></div>`;const rows=`<div class="supervisor-row"><div><h4>DEMO-014 · Bore diameter</h4><p>Measured 10.040 mm · Specification 9.985–10.015 mm</p></div><span class="status warn">Review required</span></div><div class="supervisor-row"><div><h4>DEMO-014 · Overall length</h4><p>Measured 45.030 mm · Specification 44.950–45.050 mm</p></div><span class="status">In specification</span></div>`;return `<div class="report-top"><div><span class="mono">SUPERVISOR / ONE ACCOUNT, TWO VIEWS</span><h3>Keep quality work in view.</h3><p>One supervisor account for mobile and desktop.</p></div><div class="segmented" aria-label="Supervisor preview device"><button data-device-view="desktop" aria-pressed="${this.supervisorView==='desktop'}">Desktop</button><button data-device-view="mobile" aria-pressed="${this.supervisorView==='mobile'}">Mobile</button></div></div>${this.supervisorView==='desktop'?metrics+rows:`<div class="mobile-supervisor phone"><div class="phone-top">09:41 <span>DEMO</span></div><div class="phone-appbar"><strong>Quality overview</strong><span>◎</span></div><div class="phone-inner">${metrics+rows}</div></div>`}<div class="notice" style="margin-top:18px">This is a sample supervisor layout, not predictive analytics or automated feedback. Actual permissions and available data come from FDM.</div>`;}
  drawing(){const b=this.demo.ballooned;return `<svg viewBox="0 0 460 285" role="img" aria-label="Illustrative sleeve drawing${b?' with three sample balloons':''}"><defs><pattern id="fd-hatch" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 6L6 0" stroke="#c4cfd6" stroke-width=".7"/></pattern></defs><g fill="none" stroke="#33475b" stroke-width="1.3"><path d="M77 89H310V184H77Z" fill="#eef3f6"/><path d="M77 119H310V153H77Z" stroke-dasharray="6 5"/><path d="M48 136H345" stroke-dasharray="11 4 2 4" stroke="#9fb0bf"/><circle cx="383" cy="136" r="46" fill="#f8fafb"/><circle cx="383" cy="136" r="18"/><path d="M329 136H438M383 80V191" stroke-dasharray="9 4 2 4" stroke="#9fb0bf"/><path d="M77 72V40M310 72V40M77 51H310M71 57l12-12M304 57l12-12M50 89H35M50 184H35M42 89V184M37 84l10 10M37 179l10 10"/><path d="M373 128L342 67H300"/></g><g fill="#33475b" font-family="Arial" font-size="12"><text x="172" y="42">45 ±0.05</text><text x="24" y="165" transform="rotate(-90 24 165)">Ø20 ±0.02</text><text x="279" y="60">Ø10 ±0.015</text><text x="110" y="223" font-size="10">ILLUSTRATIVE SLEEVE · NOT TO SCALE</text><text x="121" y="243" font-size="9" fill="#98a6b8">Sample drawing — no customer document</text></g>${b?`<g fill="#e9f7f2" stroke="#21c98f" stroke-width="1.5"><circle cx="31" cy="209" r="13"/><circle cx="200" cy="18" r="13"/><circle cx="303" cy="33" r="13"/></g><g fill="#07111f" font-family="monospace" font-size="12" text-anchor="middle"><text x="31" y="213">1</text><text x="200" y="22">2</text><text x="303" y="37">3</text></g>`:''}</svg>`;}
  engineer(){const b=this.demo.ballooned,a=this.demo.approved;return `<div class="report-top"><div><span class="mono">ENGINEER / ENTERPRISE · ACCOUNT ALLOCATION TO CONFIRM</span><h3>From drawing to inspection plan.</h3><p>Auto-balloon preview with an explicit engineering review step.</p></div><button class="btn small-btn ${b?'outline':''}" data-action="balloon">${b?'Reset sample drawing':'Preview auto-balloon'} <span>${b?'↺':'↗'}</span></button></div><div class="engineer-grid"><div class="drawing-sheet"><div class="mono"><span>DEMO-014 / REV B</span><span>ILLUSTRATIVE DRAWING</span></div>${this.drawing()}<div class="drawing-title"><span>SLEEVE / DEMO ONLY</span><span>REVISION B · PAGE 1/1</span></div></div><div class="engineer-fields"><h4>${b?'Review the linked characteristics.':'Prepare a connected inspection plan.'}</h4>${b?`<div class="feature-row"><span class="balloon-dot">1</span><span>Outside diameter</span><span>Ø20 ±0.02</span></div><div class="feature-row"><span class="balloon-dot">2</span><span>Overall length</span><span>45 ±0.05</span></div><div class="feature-row"><span class="balloon-dot">3</span><span>Bore diameter</span><span>Ø10 ±0.015</span></div><label class="check-label"><input type="checkbox" id="engineering-review" ${a?'checked disabled':''}>I have reviewed the sample balloon placement and characteristic links.</label><button class="btn wide" id="approve-plan" data-action="approve-plan" disabled>${a?'Sample plan approved':'Approve sample plan'} <span>${a?'✓':'→'}</span></button>`:`<p class="small muted">Use the prepared sample to show how balloon identifiers link to the quality report. No file upload or real drawing interpretation runs in this wireframe.</p><div class="context-list"><div class="context-row"><span>Drawing</span><b>Illustrative sleeve</b></div><div class="context-row"><span>Revision</span><b>B</b></div><div class="context-row"><span>Expected features</span><b>3</b></div></div>`}</div></div><div class="notice" style="margin-top:18px"><strong>Demonstration output only.</strong> No OCR, CAD or PDF processing is performed. Enterprise’s engineer auto-balloon is included in the proposed tier; real document processing, review and publication must be connected to your engineering service.</div>`;}
  scroll(id){this.$('#'+id)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}
  toast(text){const el=this.$('#fd-toast');el.textContent=text;el.classList.add('show');clearTimeout(this.toastTimer);this.toastTimer=setTimeout(()=>el.classList.remove('show'),5200);}
  modal(title,eyebrow,body){this.lastFocus=this.shadowRoot.activeElement;const d=this.$('#fd-dialog');d.innerHTML=`<div class="dialog-head"><div><span class="eyebrow">${e(eyebrow)}</span><h2 id="fd-dialog-title">${e(title)}</h2></div><button class="close" data-action="close" aria-label="Close dialog">×</button></div><div class="dialog-body">${body}</div>`;if(!d.open)d.showModal();}
  close(){if(this.busy)return;this.$('#fd-dialog').close();this.lastFocus?.focus?.({preventScroll:true});}
  download(){this.modal('Start with the free app.','TIER 01 / IN-SITU MEASUREMENT',`<p>Capture measurements at the machine. Official download links and supported platforms must be connected before publication.</p><div class="download-grid">${[['android','Android'],['ios','iPhone / iPad'],['web','Web app']].map(([id,label])=>`<div class="download-option"><div><h3>${label}</h3><p>${this.config.appDownloads?.[id]?'Open the configured official destination':'Availability and official link to confirm'}</p></div><button class="btn small-btn outline" data-download="${id}" ${this.config.appDownloads?.[id]?'':'disabled'}>Open <span>↗</span></button></div>`).join('')}</div><div class="notice">No app is downloaded by this wireframe. A disabled link does not imply the app is available on that platform.</div>${this.demo?'<div class="dialog-actions"><button class="btn" data-action="preview-free">Try the measurement preview <span>→</span></button></div>':''}`);}
  quote(){const p=K.plan(this.selected);if(p.id==='free'){this.download();return;}this.enquiryPlan=p.id;this.modal('Your '+p.name+' team.','PLAN ENQUIRY / NOT A CHECKOUT',`<p>Confirm the package and request pricing. No payment is collected and no subscription is activated here.</p><div class="dialog-seats"><div class="dialog-seat"><strong>${p.machinists}</strong><span>Machinists</span></div><div class="dialog-seat"><strong>${p.qc}</strong><span>QC desktop</span></div><div class="dialog-seat"><strong>${p.supervisors||'—'}</strong><span>Supervisor account</span></div></div><div class="notice">${p.id==='lite'?'Digital quality reports included. No Feedback-Driven Engine.':`Supervisor: one account covering mobile and desktop. Feedback-Driven Engine access is not yet specified.${p.autoBalloon?' Engineer auto-balloon included; engineer account allocation to confirm.':''}`}</div><form id="enquiry-form"><div class="form-grid"><div class="field"><label for="fd-name">Name</label><input id="fd-name" name="name" required maxlength="120" autocomplete="name"></div><div class="field"><label for="fd-company">Company</label><input id="fd-company" name="company" required maxlength="120" autocomplete="organization"></div><div class="field full"><label for="fd-email">Work email</label><input id="fd-email" name="email" type="email" required maxlength="254" autocomplete="email"></div><div class="field full"><label for="fd-note">Deployment notes (optional)</label><textarea id="fd-note" name="note" maxlength="1500" placeholder="Factory site, existing FDM setup, deployment requirements…"></textarea></div></div><label class="check-label"><input type="checkbox" name="consent" required>I agree that ConnectIQ may contact me about this specific enquiry.</label><p class="small muted">${this.demo?'DEMO: form contents stay in this page. Nothing is sent.':'LIVE: sign-in is required. Submission goes to your configured ConnectIQ service. Publish your approved privacy notice alongside this form.'}</p><p class="form-error" id="fd-form-error" role="alert"></p><div class="dialog-actions"><button class="btn outline" type="button" data-action="close">Cancel</button><button class="btn" type="submit">${this.demo?'Prepare demo enquiry':'Submit plan enquiry'} <span>→</span></button></div></form>`);}
  async submitEnquiry(form){if(this.busy)return;const formData=new FormData(form);let payload;try{payload=K.validateEnquiry({...Object.fromEntries(formData),planId:this.enquiryPlan,consent:formData.get('consent')==='on'});}catch(err){this.$('#fd-form-error').textContent=err.message;return;}
   if(this.enquiryPayload!==JSON.stringify(payload)){this.enquiryKey=uid();this.enquiryPayload=JSON.stringify(payload);}this.busy=true;const submit=form.querySelector('[type=submit]');submit.disabled=true;
   try{const result=this.demo?{id:'DEMO-'+uid(),status:'draft_not_sent'}:await this.api.submitEnquiry(payload,this.enquiryKey);this.enquiry={...payload,...result,createdAt:new Date().toISOString(),demo:!!this.demo};this.busy=false;const p=K.plan(payload.planId);this.modal(this.demo?'Demo enquiry prepared.':'Your enquiry was received.',this.demo?'LOCAL PREVIEW / NOTHING SENT':'FDM PLAN ENQUIRY',`<div class="success-mark">${this.demo?'↗':'✓'}</div><p>${this.demo?'This is a locally prepared request, not an email, order or subscription.':'The configured service confirmed receipt of your enquiry. This is not a paid order or an active licence.'}</p><div class="request-summary"><div class="context-row"><span>Selected package</span><b>${p.name}</b></div><div class="context-row"><span>Company</span><b>${e(payload.company)}</b></div><div class="context-row"><span>Contact</span><b>${e(payload.email)}</b></div><div class="context-row"><span>Pricing / billing period</span><b>To be quoted</b></div><div class="context-row"><span>Payment</span><b>Not collected</b></div><div class="context-row"><span>Subscription status</span><b>Not activated</b></div></div><div class="dialog-actions"><button class="btn outline" data-action="export-enquiry">Export ${this.demo?'demo ':''}request <span>↓</span></button><button class="btn" data-action="close">Done</button></div>`);
   }catch(error){this.$('#fd-form-error').textContent=error.message;}finally{this.busy=false;submit.disabled=false;}
  }
  saveBlob(content,type,name){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
  navigate(value){try{const url=K.safeUrl(value,this.config.allowedOrigins||[],location.href);location.assign(url);}catch(err){this.toast(err.message);}}
  async click(event){const b=event.target.closest('button,a');if(!b){const t=event.target.closest('[data-tier]');if(t&&t.dataset.tier!==this.selected)this.selectPlan(t.dataset.tier);return;}if(b.dataset.scroll){event.preventDefault();this.scroll(b.dataset.scroll);return;}if(b.dataset.plan){this.selectPlan(b.dataset.plan);return;}if(b.dataset.preview){const id=b.dataset.preview;this.selectPlan(id,id==='free'?'machinist':id==='lite'?'qc':id==='pro'?'supervisor':'engineer');this.scroll('fd-tour');return;}if(b.dataset.role){this.role=b.dataset.role;this.renderTour();this.$('#fd-role-'+this.role)?.focus({preventScroll:true});return;}if(b.dataset.unlock){this.selectPlan(b.dataset.unlock,this.role);return;}if(b.dataset.deviceView){this.supervisorView=b.dataset.deviceView;this.renderTour();return;}if(b.dataset.download){this.navigate(this.config.appDownloads?.[b.dataset.download]);return;}
   switch(b.dataset.action){case 'top':event.preventDefault();this.scroll('fd-top');break;case 'free':this.selectPlan('free');this.download();break;case 'download':this.download();break;case 'quote':this.quote();break;case 'close':this.close();break;case 'workspace':if(this.demo)this.scroll('fd-tour');else this.navigate(this.config.workspaceUrl);break;case 'workspace-live':this.navigate(this.config.workspaceUrl);break;case 'preview-free':this.close();this.selectPlan('free','machinist');this.scroll('fd-tour');break;case 'motion':this.paused=!this.paused;this.$('.fdmq').classList.toggle('paused',this.paused);b.textContent=this.paused?'▶':'Ⅱ';b.setAttribute('aria-pressed',this.paused);b.setAttribute('aria-label',this.paused?'Resume animation':'Pause animation');break;
    case 'export-report':if(this.demo&&K.allows(this.selected,'qc')){this.saveBlob(K.csv(this.demo.records),'text/csv;charset=utf-8','ConnectIQ-FDM-DEMO-quality-report.csv');this.toast('Sample CSV exported. Not a certified inspection report.');}break;
    case 'export-enquiry':if(this.enquiry)this.saveBlob(JSON.stringify(this.enquiry,null,2),'application/json','ConnectIQ-FDM-'+(this.demo?'DEMO-':'')+'enquiry.json');break;
    case 'balloon':if(this.demo&&K.allows(this.selected,'engineer')){this.demo.ballooned=!this.demo.ballooned;this.demo.approved=false;this.renderTour();}break;
    case 'approve-plan':if(this.demo&&K.allows(this.selected,'engineer')&&this.$('#engineering-review')?.checked){this.demo.approved=true;this.renderTour();this.toast('Sample inspection plan approved in this preview only.');}break;
   }
  }
  change(event){if(event.target.id==='tour-plan')this.selectPlan(event.target.value);if(event.target.id==='engineering-review')this.$('#approve-plan').disabled=!event.target.checked;}
  input(event){if(event.target.id==='fd-reading'){const box=this.$('#fd-reading-result');try{const r=K.measurement(event.target.value);box.innerHTML='<span class="status '+(r.result==='within_specification'?'':'warn')+'">'+(r.result==='within_specification'?'Within specification':r.result==='below_specification'?'Below lower specification':'Above upper specification')+'</span>';}catch{box.textContent='Enter a measurement.';}}}
  submit(event){if(event.target.id==='measurement-form'){event.preventDefault();if(!this.demo)return;try{const r=this.demo.save(event.target.elements.reading.value);this.toast('Demo measurement saved locally: '+r.value.toFixed(3)+' mm. No database write.');}catch(err){this.toast(err.message);}}if(event.target.id==='enquiry-form'){event.preventDefault();void this.submitEnquiry(event.target);}}
  keydown(event){const t=event.target.closest('[role=tab]');if(!t)return;const idx=roles.findIndex(r=>r[0]===this.role);let next;if(event.key==='ArrowRight')next=(idx+1)%4;else if(event.key==='ArrowLeft')next=(idx+3)%4;else if(event.key==='Home')next=0;else if(event.key==='End')next=3;else return;event.preventDefault();this.role=roles[next][0];this.renderTour();this.$('#fd-role-'+this.role).focus();}
 }
 if(!customElements.get('connectiq-fdm-quality'))customElements.define('connectiq-fdm-quality',FDMQuality);
})(globalThis);
</script></body></html>
