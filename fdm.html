      (function (root) {
        "use strict";
        const plans = Object.freeze([

            qc: 0,
            supervisors: 0,

            feedbackEngine: false,
            tag: "START AT THE MACHINE",
            description:
              "Capture in-situ measurements in the app. A simple starting point for the person making the part.",
          }),
          Object.freeze({
            id: "lite",
            name: "FDM Lite",
            tier: 2,
            machinists: 10,
            qc: 1,
            supervisors: 0,
            engineers: 0,
            report: true,
            autoBalloon: false,
            feedbackEngine: false,
            tag: "DIGITISE YOUR REPORTS",
            description:
              "Connect a team of 10 machinists to one QC inspector and a shared digital quality report.",
          }),
          Object.freeze({
            id: "pro",
            name: "FDM Pro",
            tier: 3,
            machinists: 50,
            qc: 2,
            supervisors: 1,
            engineers: 0,
            report: true,
            autoBalloon: false,
            feedbackEngine: null,
            tag: "BRING THE TEAM TOGETHER",
            description:
              "Coordinate 50 machinists, two QC inspectors and one supervisor across mobile and desktop.",
          }),
          Object.freeze({
            id: "enterprise",
            name: "FDM Enterprise",
            tier: 4,
            machinists: 50,
            qc: 2,
            supervisors: 1,
            engineers: null,
            report: true,
            autoBalloon: true,
            feedbackEngine: null,
            tag: "CONNECT ENGINEERING",
            description:
              "Add an engineering auto-balloon workflow to the Pro team and digital quality reporting.",
          }),
        ]);
        function plan(id) {
          return plans.find((p) => p.id === id) || plans[0];
        }
        function escape(v) {
          return String(v ?? "").replace(
            /[&<>"']/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
          );
        }
        function allows(id, role) {
          const p = plan(id);
          return (
            role === "machinist" ||
            (role === "qc" && p.qc > 0) ||
            (role === "supervisor" && p.supervisors > 0) ||
            (role === "engineer" && p.autoBalloon === true)
          );
        }
        function measurement(value, lower = 19.98, upper = 20.02) {
          if (
            value === null ||
            value === undefined ||
            typeof value === "boolean" ||
            String(value).trim() === ""
          )
            throw new Error("Enter a measurement.");
          const n = Number(value);
          if (!Number.isFinite(n) || !Number.isFinite(lower) || !Number.isFinite(upper) || lower > upper)
            throw new Error("Use a finite measurement and valid specification limits.");
          return {
            value: n,
            lower,
            upper,
            result:
              n < lower ? "below_specification" : n > upper ? "above_specification" : "within_specification",
          };
        }
        function csvCell(value) {
          let s = String(value ?? "");
          if (/^[\s]*[=+\-@]/.test(s)) s = "'" + s;
          return '"' + s.replaceAll('"', '""') + '"';
        }
        function csv(rows) {
          const keys = [
            "part",
            "revision",
            "feature",
            "value",
            "unit",
            "lower",
            "upper",
            "instrument",
            "operator",
            "result",
          ];
          return (
            "\uFEFF" +
            [keys.map(csvCell).join(","), ...rows.map((r) => keys.map((k) => csvCell(r[k])).join(","))].join(
              "\r\n",
            )
          );
        }
        function safeUrl(value, allowed = [], base = "https://local.invalid/") {
          if (typeof value !== "string" || !value.trim())
            throw new Error("This destination has not been configured.");
          if (value !== value.trim() || /[\u0000-\u0020\\]/.test(value))
            throw new Error("Invalid destination.");
          const origin = new URL(base),
            u = new URL(value, origin);
          if (u.username || u.password) throw new Error("Credentials are not allowed in a destination.");
          const same = u.origin === origin.origin && ["http:", "https:"].includes(u.protocol);
          if (!same && !(u.protocol === "https:" && allowed.includes(u.origin)))
            throw new Error("Destination is not allowlisted.");
          return u.href;
        }
        function validateEnquiry(data) {
          if (!["lite", "pro", "enterprise"].includes(data.planId))
            throw new Error("Choose a paid FDM plan.");
          for (const k of ["name", "company"])
            if (typeof data[k] !== "string" || !data[k].trim() || data[k].length > 120)
              throw new Error("Enter your name and company (maximum 120 characters each).");
          if (typeof data.email !== "string" || data.email.length > 254 || !/^\S+@\S+\.\S+$/.test(data.email))
            throw new Error("Enter a valid work email.");
          if (data.consent !== true) throw new Error("Confirm that ConnectIQ may respond to this request.");
          return {
            product: "fdm-quality",
            planId: data.planId,
            name: data.name.trim(),
            company: data.company.trim(),
            email: data.email.trim(),
            note: String(data.note || "").slice(0, 1500),
            consent: true,
            catalogVersion: "fdm-tiers-2026-10-05",
          };
        }
        root.ConnectIQFDMCore = { plans, plan, escape, allows, measurement, csv, safeUrl, validateEnquiry };
      })(globalThis);

    <script>
      /* Reference adapter client. An enquiry never creates a subscription or grants a licence. */
      (function (root) {
        "use strict";
        root.ConnectIQFDMApi = class {
          constructor(config) {
            this.config = config;
            if (!/^\/[A-Za-z0-9/_-]+$/.test(config.apiBase)) throw new Error("Use a same-origin API path.");
          }
          async request(method, path, body, csrfToken, key) {
            const controller = new AbortController(),
              timer = setTimeout(() => controller.abort(), this.config.requestTimeoutMs || 12000);
            try {
              const headers = { Accept: "application/json" };
              if (body) {
                headers["Content-Type"] = "application/json";
                headers["Idempotency-Key"] = key;
                if (!csrfToken) throw new Error("Sign in before submitting a team enquiry.");
                headers["X-CSRF-Token"] = csrfToken;
              }
              const r = await fetch(this.config.apiBase.replace(/\/$/, "") + path, {
                method,
                headers,
                credentials: "same-origin",
                cache: "no-store",
                redirect: "error",
                signal: controller.signal,
                body: body ? JSON.stringify(body) : undefined,
              });
              let data;
              try {
                data = await r.json();
              } catch {
                throw new Error("The FDM adapter did not return JSON. No request has been confirmed.");
              }
              if (!r.ok)
                throw new Error(
                  data.error?.message || "FDM service is unavailable. No request has been confirmed.",
                );
              return data;
            } catch (e) {
              if (e.name === "AbortError")
                throw new Error(
                  "The request timed out. Retry the same enquiry; its idempotency key is retained.",
                );
              throw e;
            } finally {
              clearTimeout(timer);
            }
          }
          async submitEnquiry(data, key) {
            const s = await this.request("GET", "/session");
            if (!s.user || !s.csrfToken)
              throw new Error("Sign in to ConnectIQ before submitting. No enquiry was sent.");
            const result = await this.request("POST", "/fdm/plan-enquiries", data, s.csrfToken, key);
            if (!result.id || result.status !== "received")
              throw new Error("The service did not confirm receipt. No subscription is active.");
            return result;
          }
        };
      })(globalThis);
    </script>

ration output only.</strong> No OCR, CAD or PDF processing is performed. Enterprise’s engineer auto-balloon is included in the proposed tier; real document processing, review and publication must be connected to your engineering service.</div>`;

ose">Cancel</button><button class="btn" type="submit">${this.demo ? "Prepare demo enquiry" : "Submit plan enquiry"} <span>→</span></button></div></form>`,

                  this.saveBlob(
                    K.csv(this.demo.records),
                    "text/csv;charset=utf-8",
                    "ConnectIQ-FDM-DEMO-quality-report.csv",
                  );
                  this.toast("Sample CSV exported. Not a certified inspection report.");
                }
                break;
              case "export-enquiry":
                if (this.enquiry)
                  this.saveBlob(
                    JSON.stringify(this.enquiry, null, 2),
                    "application/json",
                    "ConnectIQ-FDM-" + (this.demo ? "DEMO-" : "") + "enquiry.json",
                  );
                break;
              case "balloon":
                if (this.demo && K.allows(this.selected, "engineer")) {
                  this.demo.ballooned = !this.demo.ballooned;
                  this.demo.approved = false;
                  this.renderTour();
                }
                break;
              case "approve-plan":
                if (
                  this.demo &&
                  K.allows(this.selected, "engineer") &&
                  this.$("#engineering-review")?.checked
                ) {
                  this.demo.approved = true;
                  this.renderTour();
                  this.toast("Sample inspection plan approved in this preview only.");
                }
                break;
            }
          }
          change(event) {
            if (event.target.id === "tour-plan") this.selectPlan(event.target.value);
            if (event.target.id === "engineering-review")
              this.$("#approve-plan").disabled = !event.target.checked;
          }
          input(event) {
            if (event.target.id === "fd-reading") {
              const box = this.$("#fd-reading-result");
              try {
                const r = K.measurement(event.target.value);
                box.innerHTML =
                  '<span class="status ' +
                  (r.result === "within_specification" ? "" : "warn") +
                  '">' +
                  (r.result === "within_specification"
                    ? "Within specification"
                    : r.result === "below_specification"
                      ? "Below lower specification"
                      : "Above upper specification") +
                  "</span>";
              } catch {
                box.textContent = "Enter a measurement.";
              }
            }
          }
          submit(event) {
            if (event.target.id === "measurement-form") {
              event.preventDefault();
              if (!this.demo) return;
              try {
                const r = this.demo.save(event.target.elements.reading.value);
                this.toast(
                  "Demo measurement saved locally: " + r.value.toFixed(3) + " mm. No database write.",
                );
              } catch (err) {
                this.toast(err.message);
              }
            }
            if (event.target.id === "enquiry-form") {
              event.preventDefault();
              void this.submitEnquiry(event.target);
            }
          }
          keydown(event) {
            const t = event.target.closest("[role=tab]");
            if (!t) return;
            const idx = roles.findIndex((r) => r[0] === this.role);
            let next;
            if (event.key === "ArrowRight") next = (idx + 1) % 4;
            else if (event.key === "ArrowLeft") next = (idx + 3) % 4;
            else if (event.key === "Home") next = 0;
            else if (event.key === "End") next = 3;
            else return;
            event.preventDefault();
            this.role = roles[next][0];
            this.renderTour();
            this.$("#fd-role-" + this.role).focus();
          }
        }
        if (!customElements.get("connectiq-fdm-quality"))
          customElements.define("connectiq-fdm-quality", FDMQuality);
      })(globalThis);
    </script>
    <script src="assets/js/global.js?v=1"></script>
  </body>
